<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f3f6fa">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bormio 2026">
  <title>Vacanza a Bormio</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <a class="skip-link" href="#main">Vai al contenuto</a>
  <div id="app-shell">
    <header class="topbar">
      <button id="back-button" class="icon-button hidden" aria-label="Indietro">←</button>
      <div class="brand"><span class="brand-mark">▲</span><span>Bormio 2026</span></div>
      <button id="search-button" class="icon-button" aria-label="Cerca">⌕</button>
    </header>
    <main id="main" tabindex="-1"></main>
    <nav class="tabbar" aria-label="Navigazione principale">
      <a href="#/home" data-route="home"><span>⌂</span><small>Home</small></a>
      <a href="#/itinerario" data-route="itinerario"><span>◷</span><small>Itinerario</small></a>
      <a href="#/luoghi" data-route="luoghi"><span>⌖</span><small>Luoghi</small></a>
      <a href="#/food" data-route="food"><span>♨</span><small>Food</small></a>
      <a href="#/info" data-route="info"><span>ⓘ</span><small>Info</small></a>
    </nav>
  </div>
  <dialog id="search-dialog" class="search-dialog">
    <form method="dialog" class="search-head"><input id="global-search" type="search" placeholder="Cerca luoghi, giorni, ristoranti…" autocomplete="off"><button aria-label="Chiudi">✕</button></form>
    <div id="search-results" class="search-results"></div>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
